name: One-time Linux export

# Temporary. Removed after the v1.1.2 debug binary is uploaded as an artifact.
# Do not leave this workflow in the tree.

on:
  workflow_dispatch:
  pull_request:

jobs:
  export-linux:
    name: Export Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          godot --version

      - name: Import project
        run: godot --headless --import

      - name: Export debug Linux binary
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --export-debug "Linux" build/CelestialQSiege.x86_64
          test -s build/CelestialQSiege.x86_64
          ls -lh build/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: CelestialQSiege-linux-x86_64-debug
          path: |
            build/CelestialQSiege.x86_64
            build/CelestialQSiege.sh
          if-no-files-found: error
          retention-days: 30
